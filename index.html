<style>

  color-scheme:light;

    --bg:#0D1222; --surface:#151C31; --surface2:#1C2540; --ink:#ECF0FA; --muted:#9AA6C3; --line:#26304D;

  --bg:#0D1222; --surface:#151C31; --surface2:#1C2540; --ink:#ECF0FA; --muted:#9AA6C3; --line:#26304D;

  --r-na:#5B7FFF; --r-eu:#A78BFA; --r-jp:#FF6B93; --r-ap:#2DD4BF; --r-ea:#FBBF24; --r-la:#FB923C; --r-me:#F97316; --r-ee:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,4.2vw,46px);line-height:1.05;font-weight:800}
h2{font-size:24px;font-weight:700;line-height:1.2}
h3{font-size:17px;font-weight:600}
p{margin:0 0 .8em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center}
.globe{width:40px;height:40px;flex:none}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;line-height:1.15;display:block}
.brand span{font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a:hover{background:var(--surface2);color:var(--ink)}
nav.tabs a.on{background:var(--ink);color:var(--surface)}
nav.tabs a i{width:9px;height:9px;border-radius:3px;flex:none;background:currentColor;opacity:.55}
nav.tabs a.on i{opacity:1;background:var(--r-ea)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted)}
.theme{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;cursor:pointer;width:100%;text-align:left}

main{min-width:0;padding:36px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
.page{display:none}
.page.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}}
.lead{color:var(--muted);font-size:16.5px;max-width:68ch;margin-top:10px}
.sec{margin-top:36px}
.sec>h2{margin-bottom:6px}
.sec>.sub{color:var(--muted);margin-bottom:16px;max-width:72ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.kpi .d{font-size:12.5px;margin-top:6px;font-weight:600}
.up{color:var(--pos)} .down{color:var(--neg)}

/* world strip */
.strip{display:flex;height:64px;border-radius:14px;overflow:hidden;margin-top:26px;box-shadow:var(--shadow)}
.strip div{position:relative;overflow:hidden;min-width:2px;transition:filter .2s;cursor:default}
.strip div:hover{filter:brightness(1.12)}
.strip span{position:absolute;left:12px;bottom:9px;color:#fff;font-weight:700;font-size:14px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.strip small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{padding:10px 0;border-top:1px solid var(--line)}
ul.clean li:first-child{border-top:0}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.s[data-dir]::after{content:attr(data-dir);margin-left:4px}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
tr.grp td{background:var(--surface2);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.bars .row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 76px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.bars .track{height:12px;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden}
.bars .fill{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bars .ghost{position:absolute;top:0;bottom:0;border-right:2px solid var(--ink);opacity:.45}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 240px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}

svg text{fill:var(--ink);font-family:Figtree,system-ui,sans-serif}
svg .mut{fill:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 11px;border-radius:9px;font-size:13px;line-height:1.35;z-index:50;opacity:0;transition:opacity .12s;max-width:260px}
.tm rect{stroke:var(--surface);stroke-width:2;cursor:default}
.tm rect:hover{filter:brightness(1.12)}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;line-height:1}
.note{font-size:12.5px;color:var(--muted)}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cls div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.cls b{display:block;font-size:18px;font-family:"Bricolage Grotesque",sans-serif}
.cls span{font-size:12.5px;color:var(--muted)}
details.fund{border-bottom:1px solid var(--line)}
details.fund summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,2.6fr) 1fr .8fr .8fr .7fr .7fr;gap:10px;padding:11px 8px;align-items:center;font-size:14px}
details.fund summary::-webkit-details-marker{display:none}
details.fund summary:hover{background:var(--surface2)}

details.fund .body{padding:14px 8px 20px}
.fhead{display:grid;grid-template-columns:minmax(0,2.6fr) 1fr .8fr .8fr .7fr .7fr;gap:10px;padding:8px;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.fhead span{cursor:pointer}
.fhead span:hover{color:var(--ink)}

@media (max-width:980px){

  .theme{width:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}

@media (max-width:640px){

  .bars .row{grid-template-columns:110px 1fr 62px}
  .cls{grid-template-columns:1fr}
  .strip span small{display:none}
}

function bars(rows, { max, fmtv = v => pct(v), color = 'var(--accent)', ghost } = {}) {
  const m = max || Math.max(...rows.map(r => Math.max(r.v, r.g || 0)));
  return `<div class="bars">${rows.map(r => `
    <div class="row" data-tip="${esc(r.tip || r.n + ': ' + fmtv(r.v))}">
      <div class="nm" title="${esc(r.n)}">${esc(r.n)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(.4, r.v / m * 100)}%;background:${r.c || color}"></div>${r.g != null ? `<div class="ghost" style="left:0;width:${r.g / m * 100}%"></div>` : ''}</div>
      <div class="val">${fmtv(r.v)}</div>
    </div>`).join('')}</div>`;
}

function groupedBars(groups, series, { h = 260, fmtv = v => fmt(v, 2) + '%' } = {}) {
  const W = 640, pad = { l: 36, r: 10, t: 24, b: 40 };
  const vals = groups.flatMap(g => g.v.filter(x => x != null));
  const mx = Math.max(...vals) * 1.15, mn = Math.min(0, ...vals);
  const iw = W - pad.l - pad.r, ih = h - pad.t - pad.b;
  const y = v => pad.t + ih - (v - mn) / (mx - mn) * ih;
  const gw = iw / groups.length, bw = Math.min(46, (gw - 24) / series.length);
  let s = `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" class="mut">${fmt(v, 0)}</text>`; }
  groups.forEach((g, gi) => {
    const x0 = pad.l + gi * gw + (gw - bw * series.length) / 2;
    g.v.forEach((v, si) => {
      if (v == null) return;
      const x = x0 + si * bw, yy = y(Math.max(v, 0)), hh = Math.abs(y(v) - y(0));
      s += `<rect x="${x + 2}" y="${yy}" width="${bw - 4}" height="${Math.max(hh, 1)}" rx="5" fill="${series[si].c}" data-tip="${esc(series[si].n + ' – ' + g.n + ': ' + fmtv(v))}"/>`;
      s += `<text x="${x + bw / 2}" y="${yy - 6}" text-anchor="middle" font-size="11.5" font-weight="600">${fmt(v, 2)}</text>`;
    });
    s += `<text x="${pad.l + gi * gw + gw / 2}" y="${h - 14}" text-anchor="middle" font-size="13" class="mut">${esc(g.n)}</text>`;
  });
  return s + '</svg>' + `<div class="legend">${series.map(x => `<span><i class="dot" style="background:${x.c}"></i>${esc(x.n)}</span>`).join('')}</div>`;
}

function donut(parts, { size = 220, label = '', sub = '' } = {}) {
  const r = 80, cx = 110, cy = 110, tot = parts.reduce((a, p) => a + p.v, 0);
  let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 220 220" width="${size}" height="${size}" role="img">`;
  parts.forEach(p => {
    const a1 = a0 + p.v / tot * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    s += `<path d="M${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}" fill="none" stroke="${p.c}" stroke-width="30" data-tip="${esc(p.n + ': ' + (p.t || fmt(p.v, 2)))}"/>`;
    a0 = a1;
  });
  return s + `<text x="110" y="108" text-anchor="middle" font-size="26" font-weight="800" font-family="Bricolage Grotesque,sans-serif">${label}</text><text x="110" y="130" text-anchor="middle" font-size="12" class="mut">${sub}</text></svg>`;
}

/* squarified treemap */
function treemap(items, W, Hh) {
  const tot = items.reduce((a, b) => a + b.v, 0), out = [];
  const scale = W * Hh / tot;
  let rest = items.map(i => ({ ...i, a: i.v * scale })), x = 0, y = 0, w = W, h = Hh;
  const worst = (row, len) => { const s = row.reduce((a, b) => a + b.a, 0), mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)); return Math.max(len * len * mx / (s * s), (s * s) / (len * len * mn)); };
  while (rest.length) {
    const len = Math.min(w, h); let row = [rest[0]], i = 1;
    while (i < rest.length && worst([...row, rest[i]], len) <= worst(row, len)) { row.push(rest[i]); i++; }
    const s = row.reduce((a, b) => a + b.a, 0);
    if (w >= h) { const rw = s / h; let yy = y; row.forEach(r => { const rh = r.a / rw; out.push({ ...r, x, y: yy, w: rw, h: rh }); yy += rh; }); x += rw; w -= rw; }
    else { const rh = s / w; let xx = x; row.forEach(r => { const rw = r.a / rh; out.push({ ...r, x: xx, y, w: rw, h: rh }); xx += rw; }); y += rh; h -= rh; }
    rest = rest.slice(i);
  }
  return out;
}

function waterfall() {
  const steps = [['Nyitó nettó eszköz', 42324686694, 'b'], ['Működés eredménye', 11479429395, 'p'], ['Jegyzések', 28963492787, 'p'], ['Visszaváltások', -6805286664, 'n'], ['Záró nettó eszköz', 75962322212, 'b']];
  const W = 640, Hh = 280, pl = 10, pb = 44, pt = 26, mx = 80e9, bw = (W - pl * 2) / steps.length;
  const y = v => pt + (Hh - pt - pb) * (1 - v / mx);
  let acc = 0, s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img">`;
  steps.forEach(([n, v, t], i) => {
    let a, b;
    if (t === 'b') { a = 0; b = v; acc = v; } else { a = acc; b = acc + v; acc = b; }
    const c = t === 'b' ? 'var(--r-na)' : t === 'p' ? 'var(--pos)' : 'var(--neg)';
    const top = y(Math.max(a, b)), h = Math.abs(y(a) - y(b)), x = pl + i * bw + 14;
    s += `<rect x="${x}" y="${top}" width="${bw - 28}" height="${h}" rx="6" fill="${c}" data-tip="${n}: ${full(v)}"/>`;
    s += `<text x="${x + (bw - 28) / 2}" y="${top - 7}" text-anchor="middle" font-size="12.5" font-weight="700">${(v > 0 && t !== 'b' ? '+' : '') + money(v)}</text>`;
    s += `<text x="${x + (bw - 28) / 2}" y="${Hh - 18}" text-anchor="middle" font-size="12" class="mut">${n}</text>`;
  });
  return s + '</svg>';
}

      <p class="note">Állampapír-fedezet, háromoldalú (tri-party) elszámolással, A+ és AAA közötti minősítéssel.</p></div>
  </div>
  <p class="note sec">Igazgatói részesedések: a jelentés szerint több igazgató is tart az alapból kis tételeket (pl. Robyn Laidlaw 26 db osztalékfizető és 483 db felhalmozó részvényt).</p>`;
}
let fState = { cat: '', sort: 'na', dir: -1 };
const FX = { USD: 1, EUR: 1 / 0.8747, GBP: 1 / 0.7534 }; // a jelentés 2026.06.30-i árfolyamai
const CATHU = { 'Asset Allocation': 'Vegyes (LifeStrategy)', 'Equity': 'Részvény', 'Fixed Income': 'Kötvény' };
const MON = ['január', 'február', 'március', 'április', 'május', 'június', 'július', 'augusztus', 'szeptember', 'október', 'november', 'december'];
const hDate = s => { if (!s) return ''; const [d, m, y] = s.split('/'); return `${y}. ${MON[m - 1]} ${d}.`; };
function pFunds() {
  const tot = DATA.funds.reduce((a, f) => a + (f.na ? f.na[0] * FX[f.ccy] : 0), 0);
  const live = DATA.funds.filter(f => f.na && f.na[0] > 0).length;
  return `
  <h1>Az összes Vanguard alap a jelentésben</h1>
  <p class="lead">A Vanguard Funds plc ernyőalap ${live} működő alapja 2026. június 30-án, plusz egy év közben megszűnt alap. Kattints egy sorra a részletekért.</p>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="kpi"><div class="v num">${live}</div><div class="l">Működő alap</div></div>
    <div class="kpi"><div class="v num">≈ ${money(tot)}</div><div class="l">Összes nettó eszköz USD-ben</div></div>
    <div class="kpi"><div class="v num">${pct(NA / tot * 100, 1)}</div><div class="l">Az FTSE All-World részesedése</div></div>
  </div>
  <div class="card sec">
    <div class="controls">${['', 'Equity', 'Fixed Income', 'Asset Allocation'].map(c => `<button type="button" class="chip ${fState.cat === c ? 'on' : ''}" data-cat="${c}">${c ? CATHU[c] : 'Mind'}</button>`).join('')}</div>
    <div class="fhead"><span data-k="short">Alap</span><span data-k="na">Nettó eszköz</span><span data-k="ret">1 év</span><span data-k="bret">Index</span><span data-k="ter">Díj</span><span data-k="te">Köv. hiba</span></div>
    <div id="flist"></div>
    <p class="note" style="margin-top:10px">Hozam: az elsődleges részvényosztály egyéves hozama saját devizájában; a 2025–26-ban indult alapoknál az indulás óta (dőlt). Díj: a legalacsonyabb OCF az osztályok közül. A nettó eszköz az alap saját devizájában; az összesítéshez a jelentés év végi árfolyamait használtuk.</p>
  </div>`;
}
function afterFunds() {
  const sym = { USD: '$', EUR: '€', GBP: '£' };
  const val = (f, k) => {
    if (k === 'na') return f.na ? f.na[0] * FX[f.ccy] : -1;
    if (k === 'ret' || k === 'bret') return f[k] != null ? f[k] : -99;
    if (k === 'ter') return f.ter && f.ter.length ? Math.min(...f.ter.map(t => t[1])) : 99;
    if (k === 'te') return f.te ? f.te[1] : 99;
    return f.short;
  };
  const draw = () => {
    let arr = DATA.funds.filter(f => !fState.cat || f.cat === fState.cat);
    const k = fState.sort, d = fState.dir;
    arr.sort((a, b) => k === 'short' ? d * a.short.localeCompare(b.short) : d * (val(a, k) - val(b, k)));
    $('#flist').innerHTML = arr.map(f => {
      const ter = val(f, 'ter'), dead = f.na && f.na[0] === 0;
      const me = f.short === 'FTSE All-World UCITS ETF';
      const r = v => v == null ? '—' : `<span style="${f.since ? 'font-style:italic' : ''}">${pct(v)}</span>`;
      return `<details class="fund" ${me ? 'style="border-left:4px solid var(--r-ea)"' : ''}>
        <summary><span><b>${esc(f.short)}</b><br><span class="tag">${CATHU[f.cat]}</span> ${dead ? '<span class="tag" style="color:var(--neg)">megszűnt</span>' : ''} <span class="note">${hDate(f.launch)}</span></span>
          <span class="num">${dead ? '—' : f.na ? money(f.na[0], sym[f.ccy]) : '—'}</span>
          <span class="num ${f.ret >= 0 ? 'up' : 'down'}">${r(f.ret)}</span>
          <span class="num">${r(f.bret)}</span>
          <span class="num">${ter < 99 ? pct(ter) : '—'}</span>
          <span class="num">${f.te ? fmt(f.te[1], 3) + '%' : '—'}</span></summary>
        <div class="body">
          <p><b>Index:</b> ${esc(f.bench || '—')}</p>
          <div class="grid g2" style="margin-top:10px">
            <div><h3>Adatok</h3><ul class="clean" style="font-size:14px">
              <li>Indulás: ${hDate(f.launch)}, devizája: ${f.ccy}</li>
              <li>Hozam: ${f.ret != null ? pct(f.ret) : '—'} (index: ${f.bret != null ? pct(f.bret) : '—'})${f.since ? ', indulás óta' : ', 1 év'}</li>
              <li>Nettó eszköz: ${f.na && f.na[0] ? sym[f.ccy] + fmt(f.na[0]) : '—'}${f.na && f.na[1] ? ` (2025: ${sym[f.ccy]}${fmt(f.na[1])})` : ''}</li>
              <li>Követési hiba: ${f.te ? `várt ${fmt(f.te[0], 3)}%, tényleges ${fmt(f.te[1], 3)}%` : 'nincs adat (új alap, vagy nem követ indexet)'}</li>
              <li>Jelentés oldalszáma: ${f.page}.</li></ul></div>
            <div><h3>Díjak (OCF) osztályonként</h3><div class="scroll"><table><tbody>${(f.ter || []).map(t => `<tr><td>${esc(t[0])}</td><td class="r num">${pct(t[1])}</td></tr>`).join('') || '<tr><td class="note">Nincs adat.</td></tr>'}</tbody></table></div></div>
          </div>
        </div></details>`;
    }).join('');
    document.querySelectorAll('.fhead span').forEach(s => { s.textContent = s.textContent.replace(/ [↑↓]$/, ''); if (s.dataset.k === k) s.textContent += d < 0 ? ' ↓' : ' ↑'; });
  };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { fState.cat = b.dataset.cat; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  document.querySelectorAll('.fhead span').forEach(s => s.onclick = () => { const k = s.dataset.k; if (fState.sort === k) fState.dir *= -1; else { fState.sort = k; fState.dir = (k === 'short' || k === 'ter' || k === 'te') ? 1 : -1; } draw(); });
  draw();
}

/* ---------- router ---------- */
const AFTER = { orszagok: afterCountries, portfolio: afterHoldings, alapok: afterFunds };
$('#tabs').innerHTML = PAGES.map(([id, t]) => `<a href="#${id}" data-id="${id}"><i></i>${t}</a>`).join('');
function route() {
  const id = (location.hash || '').slice(1);
  const pg = PAGES.find(p => p[0] === id) || PAGES[0];
  const m = $('#main');
  m.innerHTML = `<section class="page on">${pg[2]()}</section>`;
  AFTER[pg[0]] && AFTER[pg[0]]();
  tipAll(m);
  document.querySelectorAll('#tabs a').forEach(a => { a.classList.toggle('on', a.dataset.id === pg[0]); if (a.dataset.id === pg[0]) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const on = $('#tabs a.on'); on && on.scrollIntoView({ block: 'nearest', inline: 'center' });
  document.title = pg[1] + ' – Vanguard FTSE All-World UCITS ETF';
  tip.style.opacity = 0;
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();

/* ---------- téma ---------- */
const themes = ['auto', 'light', 'dark'], tl = { auto: 'automatikus', light: 'világos', dark: 'sötét' };
let th = 'auto';
try { th = localStorage.getItem('vwrl-theme') || 'auto'; } catch (e) { }
function applyTheme() { if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); $('#themeBtn').textContent = 'Téma: ' + tl[th]; }
$('#themeBtn').onclick = () => { th = themes[(themes.indexOf(th) + 1) % 3]; try { localStorage.setItem('vwrl-theme', th); } catch (e) { } applyTheme(); };
applyTheme();
</script></body></html>
